<!doctype html>
<html>
    <head>
        <title>esp8266-router - login</title>
        <link rel="icon" href="data:;base64,iVBORw0KGgo=" />
        <meta charset="UTF-8" />
        <style>@import "tailwindcss";</style>
    </head>
    <body class="overflow-clip w-screen h-screen bg-black font-sans text-white flex items-center justify-center">
        <div id="login-box" class="border flex items-center justify-center flex-col text-xl gap-4 p-4">
            <h1 class="text-4xl">Login</h1>
            <div class="flex flex-col items-center justify-center w-full">
                <input id="user" placeholder="Username" class="w-full focus:outline-none placeholder:text-gray-500 focus:underline hover:underline" type="text"></input>
                <input id="pass" placeholder="Password" class="w-full focus:outline-none placeholder:text-gray-500 focus:underline hover:underline" type="password"></input>
            </div>
            <button class="w-full cursor-pointer hover:bg-white hover:text-black focus:outline-none focus:bg-white focus:text-black">Ok</button>
        </div>
    </body>
</html>
